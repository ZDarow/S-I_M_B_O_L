[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "reno-symbol-manual"
version = "2.3.0"
description = "Утилиты сборки Руководства по ремонту Renault Symbol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "mi" },
]
keywords = ["renault", "symbol", "repair-manual", "mdbook"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
]

dependencies = [
  "pikepdf>=8,<11",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
  "pytest>=8",
  "pytest-cov>=6",
  "coverage>=7",
  "bandit>=1.8",
  "beautifulsoup4>=4",
  "lxml>=5",
]
test = [
  "pytest>=8",
  "pytest-cov>=6",
  "coverage>=7",
  "beautifulsoup4>=4",
  "lxml>=5",
]
lint = [
  "ruff>=0.9",
  "bandit>=1.8",
  "mypy>=1.14",
]
crawl = [
  "requests>=2",
  "beautifulsoup4>=4",
  "lxml>=5",
  "Pillow>=10",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["scripts/test_.*", "scripts/archive/"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.html"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length enforced by formatter
exclude = ["scripts/test_*.py"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/test_*.py"]

[tool.coverage.report]
show_missing = true
fail_under = 65

[tool.bandit]
exclude_dirs = ["scripts/test_*.py", "scripts/archive/*"]
